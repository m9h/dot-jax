[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dot-jax"
version = "0.1.0"
description = "JAX/Equinox toolbox for Diffuse Optical Tomography and fNIRS"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Morgan G Hough"},
]
keywords = [
    "Diffuse Optical Tomography",
    "DOT",
    "fNIRS",
    "Near-Infrared Spectroscopy",
    "FEM",
    "JAX",
    "Equinox",
    "Inverse Problem",
    "Biomedical Optics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "lineax>=0.0.5",
    "optimistix>=0.0.5",
    "jaxtyping>=0.2.24",
    "numpy>=1.26.0",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
mesh = ["iso2mesh>=0.5.0"]
test = ["pytest>=7.0", "scipy>=1.10", "redbirdpy>=0.2.0"]
dev = ["pytest>=7.0", "scipy>=1.10", "redbirdpy>=0.2.0", "pytest-cov>=4.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "numpydoc>=1.6", "myst-parser>=2.0", "sphinx-autodoc-typehints>=1.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/dot_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["dot_jax"]
branch = true

[tool.coverage.report]
show_missing = true
